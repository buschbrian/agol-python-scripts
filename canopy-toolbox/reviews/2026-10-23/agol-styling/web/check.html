<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Styling check</title>
  <!-- Pinned to the 5.1 release line, as the COG trials. -->
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; }
    }
    :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 1fr 300px; }
    #view { height: 100%; }
    aside { overflow: auto; padding: 10px 14px; border-left: 1px solid var(--line); }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .warn { color: var(--muted); margin: 0 0 8px; }
    pre { white-space: pre-wrap; font-size: 11px; color: var(--muted); }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 65vh auto; } aside { border: 0; } }
  </style>
</head>
<body>
  <div id="view"></div>
  <aside>
    <h1 id="title">Styling check</h1>
    <p class="warn">Unvalidated LiDAR planning estimates. Local check page, signed in through ArcGIS Pro.</p>
    <div id="legend"></div>
    <pre id="out"></pre>
  </aside>
  <script type="module" src="check.js"></script>
</body>
</html>
