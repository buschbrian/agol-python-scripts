<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COG alignment check</title>
  <!-- Pinned to the 5.1 release line, as the COG trial; the page reports the exact build it loaded. -->
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; }
    }
    :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 1fr 380px; }
    arcgis-map { height: 100%; }
    aside { overflow: auto; padding: 12px 16px; border-left: 1px solid var(--line); }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .warn { color: var(--muted); margin: 0 0 10px; }
    pre { white-space: pre-wrap; font-size: 12px; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border: 0; } }
  </style>
</head>
<body>
  <arcgis-map id="map"></arcgis-map>
  <aside>
    <h1>COG alignment check</h1>
    <p class="warn">Unvalidated LiDAR planning estimates. Local test only: COGs from 127.0.0.1, contours through a local proxy.</p>
    <button id="run">Run</button>
    <pre id="out">Waiting for the layers.</pre>
  </aside>
  <script type="module" src="align.js"></script>
</body>
</html>
