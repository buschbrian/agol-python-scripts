<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slope COG trial</title>
  <!-- Pinned to the 5.1 release line; the page reports the exact build it loaded. -->
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --ok: #1a7f37; --bad: #cf222e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --ok: #3fb950; --bad: #f85149; }
    }
    :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --ok: #3fb950; --bad: #f85149; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 1fr 380px; }
    arcgis-map { height: 100%; }
    aside { overflow: auto; padding: 12px 16px; border-left: 1px solid var(--line); }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .warn { color: var(--muted); margin: 0 0 10px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 8px 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { border-bottom: 1px solid var(--line); padding: 2px 4px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .legend span { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; }
    button, select { font: inherit; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border: 0; } }
  </style>
</head>
<body>
  <arcgis-map id="map">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
  </arcgis-map>
  <aside>
    <h1>Slope percent COG trial</h1>
    <p class="warn">Unvalidated LiDAR planning estimates. Local test only: the COG is read from 127.0.0.1.</p>
    <label>Renderer
      <select id="renderer">
        <option value="classes">Classes at 10, 15, 20, 25, 30%</option>
        <option value="default">Layer default</option>
      </select>
    </label>
    <div class="legend" id="legend"></div>
    <dl id="info"></dl>
    <h2 style="font-size:13px">Last click</h2>
    <dl id="click"><dt>value</dt><dd>click the map</dd></dl>
    <button id="run">Run point checks</button>
    <table id="checks"></table>
  </aside>
  <script type="module" src="trial.js"></script>
</body>
</html>
